<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:">
<title>Lịch ESPEduShed</title>
<style>
:root {
  --background: 0 0% 100%; --foreground: 222 47% 11%; --primary: 221 83% 45%; --muted: 210 40% 96%;
  --muted-foreground: 215 16% 40%; --accent: 210 40% 94%; --destructive: 0 72% 48%; --border: 214 32% 88%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: 222 47% 7%; --foreground: 210 40% 96%; --primary: 217 91% 62%; --muted: 217 33% 16%;
    --muted-foreground: 215 20% 68%; --accent: 217 33% 20%; --destructive: 0 63% 50%; --border: 217 33% 22%;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: hsl(var(--background)); color: hsl(var(--foreground));
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid hsl(var(--border)); }
header h1 { font-size: 16px; margin: 0; flex: 1; }
header button {
  border: 1px solid hsl(var(--border)); background: hsl(var(--muted)); color: inherit; border-radius: 6px;
  padding: 4px 10px; font: inherit;
}
#status { font-size: 12px; color: hsl(var(--muted-foreground)); }
#msg { margin: 8px 16px 0; color: hsl(var(--destructive)); font-size: 13px; }
#msg:empty { display: none; }
#legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 16px 0; font-size: 12px; color: hsl(var(--muted-foreground)); }
#legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 1px solid; margin-right: 4px; vertical-align: -2px; }
#cal { flex: 1; min-height: 420px; padding: 8px 8px 16px; }
#conflicts { padding: 0 16px 16px; font-size: 13px; }
#conflicts:empty { display: none; }
#conflicts h2 { font-size: 14px; margin: 8px 0; color: hsl(var(--destructive)); }
#conflicts li { margin-bottom: 4px; }

#cal {
  --fc-border-color: hsl(var(--border)); --fc-page-bg-color: hsl(var(--background));
  --fc-neutral-bg-color: hsl(var(--muted)); --fc-neutral-text-color: hsl(var(--muted-foreground));
  --fc-list-event-hover-bg-color: hsl(var(--accent)); --fc-today-bg-color: hsl(var(--primary) / 0.08);
  --fc-now-indicator-color: hsl(var(--destructive));
  --fc-button-bg-color: hsl(var(--primary)); --fc-button-border-color: hsl(var(--primary));
  --fc-button-hover-bg-color: hsl(var(--primary) / 0.9); --fc-button-hover-border-color: hsl(var(--primary) / 0.9);
  --fc-button-active-bg-color: hsl(var(--primary) / 0.8); --fc-button-active-border-color: hsl(var(--primary) / 0.8);
}
.fc .fc-toolbar { flex-wrap: wrap; gap: 6px; }
.fc .fc-toolbar-title { font-size: 1.05rem; }
.fc .fc-button { padding: 0.3em 0.55em; font-size: 0.85rem; }
.fc .fc-prev-button, .fc .fc-next-button { min-width: 2.4em; font-size: 1.2rem; line-height: 1; font-weight: 700; }
.fc .fc-event { color: hsl(var(--foreground)); }
.ev-body { height: 100%; overflow: hidden; padding: 0 3px; font-size: 11px; line-height: 1.25; }
.ev-body b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-body div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-conflict { border-width: 2px !important; }
.ev-makeup { border-left: 4px solid #9333ea !important; }
.ev-task { border-style: dashed !important; }
.ev-cancel { opacity: 0.5; }
.ev-cancel .ev-body, .ev-cancel .fc-list-event-title { text-decoration: line-through; }
.warn { color: hsl(var(--destructive)); font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>Lịch giảng dạy</h1>
  <span id="status"></span>
  <button id="reload" type="button">Làm mới</button>
</header>
<div id="msg"></div>
<div id="legend"></div>
<div id="cal"></div>
<div id="conflicts"></div>

<script src="/fc.js"></script>
<script>
(function () {
  'use strict'
  var KIND_TASK = 2, KIND_MAKEUP = 3, STATUS_CANCELLED = 2, STATUS_HOLIDAY = 3
  var key = location.pathname.split('/')[2] || ''
  var msg = document.getElementById('msg')
  var statusEl = document.getElementById('status')

  if (typeof FullCalendar === 'undefined') {
    msg.textContent = 'Không tải được thư viện lịch từ ESP32, hãy tải lại trang.'
    return
  }

  function pad(n) { return String(n).padStart(2, '0') }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) }
  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r }
  function cancelled(it) { return it.status === STATUS_CANCELLED || it.status === STATUS_HOLIDAY }
  function el(tag, cls, text) {
    var e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  function dmy(s) { return s.slice(8, 10) + '/' + s.slice(5, 7) }

  var narrow = window.matchMedia('(max-width: 640px)').matches
  var schools = {}

  function renderLegend() {
    var box = document.getElementById('legend')
    box.textContent = ''
    Object.keys(schools).forEach(function (name) {
      var s = el('span'), i = el('i')
      i.style.background = schools[name] + '33'
      i.style.borderColor = schools[name]
      s.appendChild(i)
      s.appendChild(document.createTextNode(name))
      box.appendChild(s)
    })
  }

  function renderConflicts(data) {
    var box = document.getElementById('conflicts')
    box.textContent = ''
    var open = data.conflicts.filter(function (c) { return !c.acked })
    if (!open.length) return
    var title = {}
    data.items.forEach(function (it) { title[it.sourceId] = it.title })
    box.appendChild(el('h2', null, 'Xung đột chưa xác nhận (' + open.length + ')'))
    var ul = el('ul')
    open.forEach(function (c) {
      var why = c.reason === 2 ? 'không đủ thời gian di chuyển' : 'trùng giờ'
      ul.appendChild(el('li', null, dmy(c.date) + ' ' + c.start + '–' + c.end + ': ' +
        (title[c.a] || '#' + c.a) + ' / ' + (title[c.b] || '#' + c.b) + ' (' + why + ')'))
    })
    box.appendChild(ul)
  }

  function loadEvents(info, ok, fail) {
    var url = '/api/' + encodeURIComponent(key) + '/range?from=' + ymd(info.start) + '&to=' + ymd(addDays(info.end, -1))
    statusEl.textContent = 'Đang tải…'
    fetch(url, { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404) throw new Error('Link không còn hiệu lực. Hãy lấy link mới trong app.')
        if (!r.ok) {
          return r.json().catch(function () { return {} }).then(function (j) {
            throw new Error(j.error ? 'Server báo lỗi: ' + j.error : 'Server báo lỗi ' + r.status)
          })
        }
        return r.json()
      })
      .then(function (data) {
        msg.textContent = data.truncated ? 'Khoảng này có quá nhiều buổi, chỉ hiện một phần.' : ''
        data.items.forEach(function (it) { if (it.school) schools[it.school] = it.color })
        renderLegend()
        renderConflicts(data)
        statusEl.textContent = 'Cập nhật ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
        ok(data.items.map(function (it) {
          var conflict = !!(it.conflicts && it.conflicts.length)
          var cls = ['ev']
          if (conflict) cls.push('ev-conflict')
          if (it.kind === KIND_MAKEUP) cls.push('ev-makeup')
          if (it.kind === KIND_TASK) cls.push('ev-task')
          if (cancelled(it)) cls.push('ev-cancel')
          return {
            id: it.sourceId + ':' + it.origDate + ':' + it.start,
            title: it.title,
            start: it.date + 'T' + it.start,
            end: it.start === it.end ? undefined : it.date + 'T' + it.end,
            backgroundColor: conflict ? 'rgba(250, 204, 21, 0.35)' : it.color + '33',
            borderColor: conflict ? '#dc2626' : it.kind === KIND_MAKEUP ? '#9333ea' : it.color,
            classNames: cls,
            extendedProps: { item: it }
          }
        }))
      })
      .catch(function (e) {
        statusEl.textContent = ''
        msg.textContent = e.message || 'Không kết nối được server'
        fail(e)
      })
  }

  // Khối sự kiện giống app: môn, giờ, trường · phòng, lớp; dấu ! khi trùng
  function eventContent(arg) {
    var it = arg.event.extendedProps.item
    var conflict = !!(it.conflicts && it.conflicts.length)
    var suffix = it.status === STATUS_CANCELLED ? ' (đã huỷ)' : it.status === STATUS_HOLIDAY ? ' (nghỉ lễ)' : ''
    if (arg.view.type.indexOf('list') === 0) {
      var s = el('span')
      if (conflict) s.appendChild(el('span', 'warn', '! '))
      s.appendChild(document.createTextNode(it.title + (it.room ? ' · ' + it.room : '') +
        (it.school ? ' · ' + it.school : '') + (it.classCode ? ' · ' + it.classCode : '') + suffix))
      return { domNodes: [s] }
    }
    var body = el('div', 'ev-body')
    var b = el('b')
    if (conflict) b.appendChild(el('span', 'warn', '! '))
    b.appendChild(document.createTextNode(it.title))
    body.appendChild(b)
    body.appendChild(el('div', null, it.start === it.end ? 'Hạn ' + it.start : it.start + '–' + it.end))
    var place = [it.school, it.room].filter(Boolean).join(' · ')
    if (place) body.appendChild(el('div', null, place))
    if (it.classCode) body.appendChild(el('div', null, it.classCode))
    return { domNodes: [body] }
  }

  var cal = new FullCalendar.Calendar(document.getElementById('cal'), {
    locale: 'vi',
    firstDay: 1,
    initialView: narrow ? 'listWeek' : 'timeGridWeek',
    headerToolbar: narrow
      ? { left: 'prev,next', center: 'title', right: 'today' }
      : { left: 'prev,next today', center: 'title', right: 'timeGridWeek,timeGridDay,listWeek' },
    footerToolbar: narrow ? { center: 'listWeek,timeGridDay,timeGridWeek' } : false,
    // Mũi tên bằng ký tự thay cho phông biểu tượng của FullCalendar: trình duyệt nào chặn phông nhúng cũng hiện đúng
    buttonIcons: false,
    buttonText: { prev: '‹', next: '›', today: 'Hôm nay', listWeek: 'Danh sách', timeGridDay: 'Ngày', timeGridWeek: 'Tuần' },
    height: '100%',
    allDaySlot: false,
    nowIndicator: true,
    slotMinTime: '06:00:00',
    slotMaxTime: '22:00:00',
    slotDuration: '00:30:00',
    defaultTimedEventDuration: '00:30:00',
    slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
    eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
    noEventsContent: 'Không có buổi nào',
    events: loadEvents,
    eventContent: eventContent
  })
  cal.render()

  document.getElementById('reload').addEventListener('click', function () { cal.refetchEvents() })
  // Quay lại trang (mở lại tab, mở khoá màn hình) thì tải lại; khi đang mở thì tải lại mỗi phút
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') cal.refetchEvents()
  })
  setInterval(function () { if (document.visibilityState === 'visible') cal.refetchEvents() }, 60000)
})()
</script>
</body>
</html>
